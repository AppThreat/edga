name: release

# A v* tag builds edga for each platform, runs the golden tests on the binary, and attaches it to
# the tag's GitHub release with its SHA-256, next to the build's SBOM. atom's container images
# download these assets.
#
# Temporary, until the next release: a push to main builds the same binaries and pushes each to
# ghcr.io/appthreat/edga:main-<platform> (and :<commit>-<platform>) with oras, for chen's and atom's
# CI to test against what main exports.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: ubuntu-24.04
            platform: linuxmusl-amd64
            musl: true
          - os: ubuntu-24.04-arm
            platform: linuxmusl-arm64
            musl: true
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: EDG sources
        run: tools/fetch-edg.sh
      - name: Build and golden tests (musl)
        if: ${{ matrix.musl }}
        run: tools/build-alpine.sh build
      - name: Tools (Linux)
        if: ${{ runner.os == 'Linux' && !matrix.musl }}
        run: sudo apt-get install -y ninja-build g++
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build
        if: ${{ !matrix.musl }}
        run: |
          # Linux release builds are static; the macOS one runs on macOS 13 and later.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build --target edga
          ./build/bin/edga --version
      - name: Golden tests
        if: ${{ !matrix.musl }}
        run: |
          python3 -m pip install --quiet jsonschema || python3 -m pip install --quiet --break-system-packages jsonschema
          python3 tests/run.py --edga build/bin/edga
      - name: Package
        run: |
          mkdir dist
          cp build/bin/edga "dist/edga-${{ matrix.platform }}"
          cd dist
          shasum -a 256 "edga-${{ matrix.platform }}" > "edga-${{ matrix.platform }}.sha256"
          cat "edga-${{ matrix.platform }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: edga-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: edga-*
          path: dist
          merge-multiple: true
      - name: SBOM
        run: |
          python3 tools/sbom.py dist/sbom-edga.cdx.json
          cd dist
          shasum -a 256 sbom-edga.cdx.json > sbom-edga.cdx.json.sha256
      - name: Release
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/edga-* dist/sbom-edga.* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  main:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: edga-*
          path: dist
          merge-multiple: true
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1
      - name: Push main's binaries to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for binary in dist/edga-*; do
            [[ "$binary" == *.sha256 ]] && continue
            platform=${binary#dist/edga-}
            # one file named edga per platform, so a pull writes ./edga
            mkdir -p "push/$platform"
            cp "$binary" "push/$platform/edga"
            (
              cd "push/$platform"
              oras push "ghcr.io/appthreat/edga:main-$platform,$GITHUB_SHA-$platform" \
                --artifact-type application/vnd.appthreat.edga.binary \
                --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
                edga:application/octet-stream
            )
          done
